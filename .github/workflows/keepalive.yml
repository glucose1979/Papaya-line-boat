# Wake the Render service during Taipei daytime only.
# 06:00–23:00 Asia/Taipei is 22:00–15:00 UTC.
# GitHub cron is UTC and has no timezone field, so the window is split:
#   */10 through 14:50 UTC, then one last ping at 15:00 UTC (23:00 Taipei).
# A failed ping must not fail the workflow.

name: Keepalive

on:
  schedule:
    - cron: "*/10 22,23,0-14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        run: |
          curl \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 90 \
            --output /dev/null \
            --write-out "keepalive %{http_code}\n" \
            "https://papaya-line-boat.onrender.com/healthz" \
            || echo "keepalive ping failed; not failing the job"
